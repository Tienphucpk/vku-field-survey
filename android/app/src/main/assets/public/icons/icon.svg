<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="128" y="96" width="256" height="330" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="144" y="120" width="224" height="290" rx="14" fill="white"/>
  <!-- Clipboard clip -->
  <rect x="196" y="76" width="120" height="56" rx="10" fill="white"/>
  <rect x="216" y="88" width="80" height="26" rx="13" fill="url(#accent)"/>
  <!-- Survey line 1 - checked -->
  <rect x="172" y="172" r="14" width="28" height="28" rx="7" fill="#10b981"/>
  <path d="M180 186 L184 192 L196 178" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="178" width="120" height="14" rx="4" fill="#e2e8f0"/>
  <!-- Survey line 2 - checked -->
  <rect x="172" y="222" width="28" height="28" rx="7" fill="#10b981"/>
  <path d="M180 236 L184 242 L196 228" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="228" width="100" height="14" rx="4" fill="#e2e8f0"/>
  <!-- Survey line 3 - warning -->
  <rect x="172" y="272" width="28" height="28" rx="7" fill="#f59e0b"/>
  <text x="186" y="292" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">!</text>
  <rect x="216" y="278" width="110" height="14" rx="4" fill="#e2e8f0"/>
  <!-- Survey line 4 - pending -->
  <rect x="172" y="322" width="28" height="28" rx="7" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="216" y="328" width="85" height="14" rx="4" fill="#e2e8f0"/>
  <!-- VKU text -->
  <text x="256" y="462" text-anchor="middle" fill="rgba(255,255,255,0.95)" font-size="40" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="6">VKU</text>
